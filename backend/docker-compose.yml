services:
  postgres:
    image: postgres:16
    container_name: ishyiga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ishyiga
      POSTGRES_PASSWORD: ishyiga
      POSTGRES_DB: ishyiga
    ports:
      - "5432:5432"
    volumes:
      - ishyiga_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ishyiga -d ishyiga"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ishyiga_pgdata:
