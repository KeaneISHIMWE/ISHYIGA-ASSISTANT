<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ishyiga Assistant — Conversations</title>
  <style>
    :root {
      --navy: #0b1f3a;
      --navy-2: #122846;
      --teal: #0f766e;
      --gold: #c4a35a;
      --ink: #e8eef6;
      --muted: #93a0b4;
      --paper: #08131f;
      --card: #112033;
      --line: #1e334d;
      --client: #d6b15a;
      --assistant: #3d9d8f;
      --danger: #d46a6a;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    .app {
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      height: 100%;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 22px;
      background: var(--navy);
      border-bottom: 2px solid var(--gold);
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--assistant);
      box-shadow: 0 0 0 4px rgba(61, 157, 143, 0.18);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
      padding: 12px 22px;
      background: #0c1a2b;
      border-bottom: 1px solid var(--line);
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
    }

    .flow {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      background: var(--navy-2);
    }

    .flow-step {
      min-width: 110px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      font-size: 12px;
      text-align: center;
    }

    .flow-step b { display: block; font-size: 13px; }
    .flow-step small { color: var(--muted); }
    .flow-arrow { color: var(--gold); font-weight: 700; }

    .workspace {
      display: grid;
      grid-template-columns: 320px 1fr 300px;
      min-height: 0;
    }

    .inbox, .thread, .details {
      min-height: 0;
      overflow: auto;
    }

    .inbox { border-right: 1px solid var(--line); }
    .details { border-left: 1px solid var(--line); background: #0d1c2e; }

    .panel-head {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 12px;
      background: #0d1c2e;
      border-bottom: 1px solid var(--line);
    }

    .panel-head input {
      width: 100%;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
    }

    .chat {
      display: block;
      width: 100%;
      text-align: left;
      color: inherit;
      font: inherit;
      padding: 12px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
    }

    .chat:hover, .chat.active { background: #17324f; }
    .chat .top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
    }

    .chat .name { font-weight: 650; }
    .chat .preview {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10px;
      background: #1d3b2f;
      color: #9be7c4;
    }

    .thread-messages { padding: 16px; }

    .bubble-row {
      display: flex;
      margin-bottom: 14px;
    }

    .bubble-row.customer { justify-content: flex-start; }
    .bubble-row.assistant { justify-content: flex-end; }

    .bubble {
      max-width: min(72%, 560px);
      padding: 10px 12px;
      border-radius: 14px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .bubble.customer { background: #24344a; }
    .bubble.assistant { background: #15564f; }
    .bubble.selected { border-color: var(--gold); }

    .bubble .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      color: #c9d4e3;
      font-size: 11px;
    }

    .bubble p { margin: 0; white-space: pre-wrap; line-height: 1.4; }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }

    .details section { padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .details h2 { margin: 0 0 10px; font-size: 13px; color: var(--gold); text-transform: uppercase; }
    .kv { margin: 0 0 8px; font-size: 13px; }
    .kv span { display: block; color: var(--muted); font-size: 11px; }
    .path { display: flex; flex-wrap: wrap; gap: 6px; }
    .path em {
      font-style: normal;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 11px;
    }

    @media (max-width: 1100px) {
      .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .workspace { grid-template-columns: 280px 1fr; }
      .details { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
    }

    #gate {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 19, 31, 0.92);
      z-index: 20;
      align-items: center;
      justify-content: center;
    }
    #gate.open { display: flex; }
    #gate form {
      width: min(420px, 92vw);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 22px;
    }
    #gate input { width: 100%; margin: 10px 0; }
    #gate button {
      background: var(--gold);
      color: #1a1406;
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    #gateError { color: #f0a0a0; min-height: 1.2em; }

    @media (max-width: 720px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .workspace { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="gate">
    <form id="gateForm">
      <h2 style="margin:0 0 8px">Conversations are protected</h2>
      <p style="color:var(--muted);margin:0 0 8px">Enter the conversation API key. Only people with this key can load chats.</p>
      <input id="apiKeyInput" type="password" autocomplete="current-password" placeholder="CONVERSATIONS_API_KEY" />
      <button type="submit">Unlock</button>
      <p id="gateError"></p>
    </form>
  </div>
  <div class="app">
    <header>
      <div>
        <h1>Ishyiga Assistant</h1>
        <p>Live WhatsApp conversations — every inbound and outbound message</p>
      </div>
      <div class="live">
        <a href="/docs/" style="color:#d6b15a;text-decoration:none;margin-right:14px">API docs</a>
        <span class="dot"></span><span id="updated">Loading…</span>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="flow" id="flow"></section>

    <main class="workspace">
      <aside class="inbox">
        <div class="panel-head">
          <strong>Inbox</strong>
          <input id="search" type="search" placeholder="Search name or WhatsApp number" />
        </div>
        <div id="inbox"></div>
      </aside>

      <section class="thread">
        <div class="panel-head" id="threadHead">
          <strong>Select a conversation</strong>
        </div>
        <div class="thread-messages" id="thread"></div>
      </section>

      <aside class="details" id="details"></aside>
    </main>
  </div>

  <script>
    const KEY_STORAGE = "ishyiga.conversationsApiKey";
    const state = {
      conversations: [],
      selectedId: null,
      selectedMessageId: null,
      conversation: null,
      query: "",
    };

    function getApiKey() {
      return sessionStorage.getItem(KEY_STORAGE) || "";
    }

    function apiFetch(url) {
      return fetch(url, {
        headers: {
          Authorization: `Bearer ${getApiKey()}`,
        },
      });
    }

    function showGate(message) {
      document.getElementById("gate").classList.add("open");
      document.getElementById("gateError").textContent = message || "";
    }

    function hideGate() {
      document.getElementById("gate").classList.remove("open");
      document.getElementById("gateError").textContent = "";
    }

    const flowSteps = [
      ["1", "Client writes", "WhatsApp message"],
      ["2", "WhatsApp", "Delivers to server"],
      ["3", "Server", "Saves the chat"],
      ["4", "Client record", "Adds known facts"],
      ["5", "OpenAI", "Writes the reply"],
      ["6", "WhatsApp", "Sends the answer"],
      ["7", "Client reads", "Sees the reply"],
    ];

    function renderFlow() {
      document.getElementById("flow").innerHTML = flowSteps.map((step, index) => {
        const card = `<div class="flow-step"><b>${step[1]}</b><small>${step[2]}</small></div>`;
        const arrow = index < flowSteps.length - 1 ? `<div class="flow-arrow">→</div>` : "";
        return card + arrow;
      }).join("");
    }

    function formatTime(value) {
      if (!value) return "—";
      return new Date(value).toLocaleString();
    }

    function preview(text) {
      return text ? text.replace(/\s+/g, " ").slice(0, 90) : "No messages yet";
    }

    function renderStats(stats = {}) {
      const items = [
        ["Customers", stats.customers],
        ["Conversations", stats.conversations],
        ["Open chats", stats.openConversations],
        ["All messages", stats.messages],
        ["From clients", stats.inbound],
        ["From assistant", stats.outbound],
        ["Screenshots", stats.images],
      ];
      document.getElementById("stats").innerHTML = items.map(([label, value]) => (
        `<div class="stat"><span>${label}</span><strong>${value ?? 0}</strong></div>`
      )).join("");
    }

    function filteredConversations() {
      const q = state.query.trim().toLowerCase();
      if (!q) return state.conversations;
      return state.conversations.filter((item) => {
        const name = (item.customer.name || "").toLowerCase();
        const phone = (item.customer.whatsappNumber || "").toLowerCase();
        return name.includes(q) || phone.includes(q);
      });
    }

    function renderInbox() {
      const rows = filteredConversations();
      const root = document.getElementById("inbox");
      if (!rows.length) {
        root.innerHTML = `<div class="empty">No conversations yet. When a client writes on WhatsApp, the chat will appear here.</div>`;
        return;
      }

      root.innerHTML = rows.map((item) => `
        <button type="button" class="chat ${item.id === state.selectedId ? "active" : ""}" data-id="${item.id}">
          <div class="top">
            <span class="name">${item.customer.name || "Unknown client"}</span>
            <span class="badge">${item.status}</span>
          </div>
          <div class="preview">+${item.customer.whatsappNumber || ""} · ${preview(item.lastMessage)}</div>
          <div class="preview">${item.counts.inbound} in · ${item.counts.outbound} out · ${formatTime(item.lastMessageAt || item.updatedAt)}</div>
        </button>
      `).join("");

      root.querySelectorAll(".chat").forEach((node) => {
        node.addEventListener("click", () => selectConversation(node.dataset.id));
      });
    }

    function renderThread() {
      const conversation = state.conversation;
      const head = document.getElementById("threadHead");
      const thread = document.getElementById("thread");

      if (!conversation) {
        head.innerHTML = "<strong>Select a conversation</strong>";
        thread.innerHTML = `<div class="empty">Choose a chat on the left to see every message the client sent and every reply the assistant sent.</div>`;
        return;
      }

      head.innerHTML = `
        <strong>${conversation.customer.name || "Unknown client"}</strong>
        <p style="margin:4px 0 0;color:var(--muted);font-size:13px">
          +${conversation.customer.whatsappNumber} · ${conversation.counts.messages} messages
        </p>
      `;

      if (!conversation.messages.length) {
        thread.innerHTML = `<div class="empty">This conversation has no stored messages yet.</div>`;
        return;
      }

      thread.innerHTML = conversation.messages.map((message) => `
        <div class="bubble-row ${message.sender}">
          <div class="bubble ${message.sender} ${message.id === state.selectedMessageId ? "selected" : ""}" data-id="${message.id}">
            <div class="meta">
              <span>${message.senderLabel} · ${message.type}</span>
              <span>${formatTime(message.createdAt)}</span>
            </div>
            <p>${escapeHtml(message.text)}</p>
          </div>
        </div>
      `).join("");

      thread.querySelectorAll(".bubble").forEach((node) => {
        node.addEventListener("click", () => {
          state.selectedMessageId = node.dataset.id;
          renderThread();
          renderDetails();
        });
      });
    }

    function selectedMessage() {
      const messages = state.conversation && state.conversation.messages;
      if (!messages) return null;
      return messages.find((item) => item.id === state.selectedMessageId) || messages[messages.length - 1];
    }

    function kv(label, value) {
      return `<div class="kv"><span>${label}</span>${value == null || value === "" ? "—" : escapeHtml(String(value))}</div>`;
    }

    function renderDetails() {
      const conversation = state.conversation;
      const root = document.getElementById("details");
      if (!conversation) {
        root.innerHTML = `<section><h2>Details</h2><p class="empty">Select a conversation to see customer, delivery, and message data.</p></section>`;
        return;
      }

      const message = selectedMessage();
      const profile = conversation.clientProfile || {};
      const profileRows = [
        ["Name", profile.name],
        ["Company", profile.company],
        ["TIN", profile.tin],
        ["Software", profile.software],
        ["Version", profile.version],
        ["Plan", profile.plan],
        ["Location", profile.location],
        ["Email", profile.email],
        ["Notes", profile.notes],
      ].filter(([, value]) => value);

      root.innerHTML = `
        <section>
          <h2>Customer</h2>
          ${kv("Name", conversation.customer.name)}
          ${kv("WhatsApp number", conversation.customer.whatsappNumber)}
          ${kv("Customer id", conversation.customer.id)}
          ${kv("Customer since", formatTime(conversation.customer.createdAt))}
        </section>
        <section>
          <h2>Conversation</h2>
          ${kv("Conversation id", conversation.id)}
          ${kv("Status", conversation.status)}
          ${kv("Opened", formatTime(conversation.createdAt))}
          ${kv("Updated", formatTime(conversation.updatedAt))}
          ${kv("Inbound", conversation.counts.inbound)}
          ${kv("Outbound", conversation.counts.outbound)}
          ${kv("Screenshots", conversation.counts.images)}
        </section>
        <section>
          <h2>Selected message</h2>
          ${message ? `
            ${kv("From", message.senderLabel)}
            ${kv("Type", message.type)}
            ${kv("Sent at", formatTime(message.createdAt))}
            ${kv("WhatsApp message id", message.whatsappMessageId)}
            ${kv("Delivered on WhatsApp", message.deliveredToWhatsApp ? "Yes" : "No")}
            ${kv("Message id", message.id)}
            <div class="kv"><span>Send path</span></div>
            <div class="path">${message.path.map((step) => `<em>${step}</em>`).join(" → ")}</div>
          ` : "<p class='empty'>No message selected.</p>"}
        </section>
        <section>
          <h2>Client record</h2>
          ${profileRows.length ? profileRows.map(([label, value]) => kv(label, value)).join("") : "<p class='empty'>No client API record for this number.</p>"}
        </section>
      `;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    async function selectConversation(id) {
      state.selectedId = id;
      state.selectedMessageId = null;
      renderInbox();
      const response = await apiFetch(`/api/conversations/${id}`);
      if (response.status === 401 || response.status === 503) {
        showGate("The API key was rejected.");
        return;
      }
      const data = await response.json();
      state.conversation = data.conversation || null;
      if (state.conversation && state.conversation.messages.length) {
        state.selectedMessageId = state.conversation.messages[state.conversation.messages.length - 1].id;
      }
      renderThread();
      renderDetails();
    }

    async function refresh() {
      const keepMessageId = state.selectedMessageId;
      const [dashboardRes, conversationsRes] = await Promise.all([
        apiFetch("/api/dashboard"),
        apiFetch("/api/conversations"),
      ]);
      if (dashboardRes.status === 401 || dashboardRes.status === 503) {
        showGate("Enter the conversation API key to load chats.");
        throw new Error("unauthorized");
      }
      const dashboard = await dashboardRes.json();
      const conversations = await conversationsRes.json();
      renderStats(dashboard.stats);
      state.conversations = conversations.conversations || [];
      renderInbox();
      if (state.selectedId) {
        const response = await apiFetch(`/api/conversations/${state.selectedId}`);
        const data = await response.json();
        state.conversation = data.conversation || null;
        const ids = (state.conversation && state.conversation.messages || []).map((item) => item.id);
        state.selectedMessageId = ids.includes(keepMessageId) ? keepMessageId : ids[ids.length - 1] || null;
      }
      renderThread();
      renderDetails();
      document.getElementById("updated").textContent = `Updated ${new Date().toLocaleTimeString()}`;
    }

    document.getElementById("search").addEventListener("input", (event) => {
      state.query = event.target.value;
      renderInbox();
    });

    document.getElementById("gateForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const key = document.getElementById("apiKeyInput").value.trim();
      if (!key) {
        showGate("The API key is required.");
        return;
      }
      sessionStorage.setItem(KEY_STORAGE, key);
      try {
        await refresh();
        hideGate();
      } catch (_error) {
        document.getElementById("updated").textContent = "Could not load dashboard";
      }
    });

    renderFlow();
    renderDetails();
    if (!getApiKey()) {
      showGate("Enter the conversation API key to load chats.");
    } else {
      refresh().catch(() => {
        document.getElementById("updated").textContent = "Could not load dashboard";
      });
    }
    setInterval(() => {
      if (!getApiKey() || document.getElementById("gate").classList.contains("open")) {
        return;
      }
      refresh().catch(() => {});
    }, 5000);
  </script>
</body>
</html>
